name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter create . --platforms=android --project-name vastu_plot_chakra_pdf --org com.graphicpoint
      - name: Remove generated stale test
        run: rm -f test/widget_test.dart
      - name: Install Android CHKRA folder reader
        run: bash scripts/patch_android.sh
      - name: Set compile SDK 35
        run: sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g; s/compileSdk flutter.compileSdkVersion/compileSdk 35/g' android/app/build.gradle || true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: vastu-plot-chakra-pdf-apk
          path: build/app/outputs/flutter-apk/app-release.apk
